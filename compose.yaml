name: dtc245160035-wordpress

services:
  mysql:
    image: mysql:8.4
    container_name: dtc245160035-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  wordpress:
    image: wordpress:php8.3-apache
    container_name: dtc245160035-wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: dtc245160035-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    container_name: dtc245160035-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
    name: dtc245160035-mysql-data

  wordpress_data:
    name: dtc245160035-wordpress-data

networks:
  frontend:
    name: dtc245160035-frontend
    driver: bridge

  backend:
    name: dtc245160035-backend
    driver: bridge
    internal: true
